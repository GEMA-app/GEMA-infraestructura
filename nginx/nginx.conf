# =============================================================================
# GEMA - Gestión Estratégica de Mantenimiento de Activos
# Nginx - Configuración del Reverse Proxy
# =============================================================================
# Este archivo configura Nginx como punto de entrada único para GEMA.
# Rutas:
#   /api/  → backend FastAPI (puerto 8000)
#   /      → frontend Next.js (puerto 3000)
#
# Para habilitar HTTPS con Let's Encrypt, sigue las instrucciones al final.
# =============================================================================

# Número de procesos worker. "auto" = uno por CPU disponible.
worker_processes auto;

# Número máximo de conexiones simultáneas por worker.
events {
    worker_connections 1024;
}

http {
    # -------------------------------------------------------------------------
    # Configuración global de HTTP
    # -------------------------------------------------------------------------

    # Incluye los tipos MIME estándar (html, css, js, imágenes, etc.)
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Formato de log personalizado para facilitar el debugging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # Optimizaciones de rendimiento
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;

    # Tiempo máximo de conexión keep-alive
    keepalive_timeout 65;

    # Tamaño máximo de uploads (ajusta según necesidades de GEMA)
    client_max_body_size 50M;

    # Oculta la versión de Nginx por seguridad
    server_tokens off;

    # -------------------------------------------------------------------------
    # Upstream: Backend FastAPI
    # "backend" es el nombre del servicio en docker-compose.yml
    # -------------------------------------------------------------------------
    upstream backend_upstream {
        server backend:8000;
        # Para múltiples instancias del backend (escalado horizontal):
        # server backend_1:8000;
        # server backend_2:8000;
    }

    # -------------------------------------------------------------------------
    # Upstream: Frontend Next.js
    # "frontend" es el nombre del servicio en docker-compose.yml
    # -------------------------------------------------------------------------
    upstream frontend_upstream {
        server frontend:3000;
    }

    # =========================================================================
    # Servidor principal - HTTP en puerto 80
    # =========================================================================
    server {
        listen 80;
        server_name _;  # Acepta cualquier dominio. En producción, pon tu dominio.
        # server_name gema.tu-dominio.com;

        # ---------------------------------------------------------------------
        # PREPARACIÓN PARA SSL (Let's Encrypt / Certbot)
        # Descomenta este bloque cuando configures HTTPS y comenta el resto.
        # ---------------------------------------------------------------------
        # location /.well-known/acme-challenge/ {
        #     root /var/www/certbot;
        # }
        #
        # # Redirige todo el tráfico HTTP a HTTPS
        # location / {
        #     return 301 https://$host$request_uri;
        # }

        # ---------------------------------------------------------------------
        # Endpoint de health-check de Nginx (usado por Docker Compose)
        # ---------------------------------------------------------------------
        location /health-nginx {
            access_log off;
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }

        # ---------------------------------------------------------------------
        # /api/ → Backend FastAPI
        # Todas las peticiones a /api/* se redirigen al servicio backend.
        # El proxy_pass con trailing slash remueve el prefijo /api/ antes
        # de enviar la petición al backend.
        # Ejemplo: GET /api/v1/activos → GET /v1/activos en FastAPI
        # ---------------------------------------------------------------------
        location /api/ {
            proxy_pass http://backend_upstream/;

            # Headers necesarios para que FastAPI conozca la IP real del cliente
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeouts para peticiones largas (reportes, exportaciones, etc.)
            proxy_connect_timeout 60s;
            proxy_send_timeout    60s;
            proxy_read_timeout    60s;

            # Soporte para WebSockets (si el backend los usa)
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # ---------------------------------------------------------------------
        # / → Frontend Next.js
        # Todo el tráfico que no sea /api/ va al frontend.
        # ---------------------------------------------------------------------
        location / {
            proxy_pass http://frontend_upstream;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Soporte para WebSockets (Next.js hot-reload en desarrollo)
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_connect_timeout 60s;
            proxy_send_timeout    60s;
            proxy_read_timeout    60s;
        }
    }

    # =========================================================================
    # Servidor HTTPS - Puerto 443 (COMENTADO - activar con Let's Encrypt)
    # =========================================================================
    # Para habilitar HTTPS:
    # 1. Instala Certbot: sudo apt install certbot python3-certbot-nginx
    # 2. Obtén el certificado: sudo certbot --nginx -d gema.tu-dominio.com
    # 3. Descomenta este bloque y ajusta las rutas de los certificados.
    # 4. Reinicia Nginx: docker compose restart nginx
    #
    # server {
    #     listen 443 ssl http2;
    #     server_name gema.tu-dominio.com;
    #
    #     # Certificados SSL generados por Let's Encrypt
    #     ssl_certificate     /etc/letsencrypt/live/gema.tu-dominio.com/fullchain.pem;
    #     ssl_certificate_key /etc/letsencrypt/live/gema.tu-dominio.com/privkey.pem;
    #
    #     # Configuración de seguridad SSL recomendada
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     ssl_ciphers HIGH:!aNULL:!MD5;
    #     ssl_prefer_server_ciphers on;
    #     ssl_session_cache shared:SSL:10m;
    #     ssl_session_timeout 10m;
    #
    #     # Headers de seguridad HTTP
    #     add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    #     add_header X-Content-Type-Options nosniff;
    #     add_header X-Frame-Options DENY;
    #     add_header X-XSS-Protection "1; mode=block";
    #
    #     location /api/ {
    #         proxy_pass http://backend_upstream/;
    #         proxy_set_header Host              $host;
    #         proxy_set_header X-Real-IP         $remote_addr;
    #         proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    #         proxy_set_header X-Forwarded-Proto https;
    #     }
    #
    #     location / {
    #         proxy_pass http://frontend_upstream;
    #         proxy_set_header Host              $host;
    #         proxy_set_header X-Real-IP         $remote_addr;
    #         proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    #         proxy_set_header X-Forwarded-Proto https;
    #     }
    # }
}
